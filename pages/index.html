        </button>

        <img class="rounded-full m-auto w-1/4 md:w-1/2 max-w-[350px]" src="../assets/images/profile-img.png" alt=""
            id="profile">
        <div class="*:my-5 md:order-first">
            <p class="text-xl">Hello there! 👋</p>
            <h1 class="text-3xl font-bold">I'm <span class="text-sky-600">Kaila Anderson</span></h1>
            <hr class="w-1/3 m-auto border-2 border-black">
            <p>I develop web apps and sites that solve problems and improve everyday tasks.</p>
            <button
                class="border border-black rounded-md w-1/2 h-[50px]  bg-cyan-300 text-black  duration-1000 ease-in-out hover:text-white hover:border-cyan-600 hover:bg-gradient-to-r from-sky-950 via-sky-500 to-sky-300 m-auto"><a
                    href="#sect-contact">Let's bring your website idea to life!
                </a></button>
        </div>
        <hr class="w-2/3 m-auto border-2 md:col-span-2 hidden md:block">

        <section id="sect-projects" class="text-center">

            <h2 class="text-2xl text-center m-auto my-5 font-bold">Featured Work</h2>
            <div class="grid lg:grid-cols-3 md:grid-cols-2 feat-work-container mx-20"></div>
            <button
                class="border border-black rounded-md mt-5 w-1/4 h-[25px]  bg-cyan-300 text-black  duration-1000 ease-in-out hover:text-white hover:border-cyan-600 hover:bg-gradient-to-r from-sky-950 via-sky-500 to-sky-300"><a
                    href="./projectPage.html">See more
                </a></button>
            <hr class="w-2/3 m-auto border-2 md:col-span-2 hidden md:block mt-5">
        </section>


        <section id="sect-contact" class="card">
            <h2 class="text-2xl text-center m-auto my-5 font-bold">Contact Me</h2>
            <div class=" margin-auto">
                <img src="../assets/images/mail-img.png" alt="" id="img-mail" class="m-auto">
                <form action="#" method="POST" class="mx-auto w-6/7">
                    <div class="grid grid-cols-1 gap-x-8 gap-y-6 sm:grid-cols-2">
                        <div>
                            <label for="first-name" class="block text-sm/6 font-semibold text-gray-900">First
                                name</label>
                            <div class="mt-2.5">
                                <input type="text" name="first-name" id="first-name" autocomplete="given-name"
                                    class="block w-full rounded-md bg-white px-3.5 py-2 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600">
                            </div>
                        </div>
                        <div>
                            <label for="last-name" class="block text-sm/6 font-semibold text-gray-900">Last name</label>
                            <div class="mt-2.5">
                                <input type="text" name="last-name" id="last-name" autocomplete="family-name"
                                    class="block w-full rounded-md bg-white px-3.5 py-2 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600">
                            </div>
                        </div>
                        <div class="sm:col-span-2">
                            <label for="company" class="block text-sm/6 font-semibold text-gray-900">Company<span class="text-xs"> (Optional)</span></label>
                            <div class="mt-2.5">
                                <input type="text" name="company" id="company" autocomplete="organization"
                                    class="block w-full rounded-md bg-white px-3.5 py-2 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600">
                            </div>
                        </div>
                        <div class="sm:col-span-2">
                            <label for="email" class="block text-sm/6 font-semibold text-gray-900">Email</label>
                            <div class="mt-2.5">
                                <input type="email" name="email" id="email" autocomplete="email"
                                    class="block w-full rounded-md bg-white px-3.5 py-2 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600">
                            </div>
                        </div>
                        <div class="sm:col-span-2">
                            <label for="phone-number" class="block text-sm/6 font-semibold text-gray-900">Phone
                                number</label>
                            <div class="mt-2.5">
                                <div
                                    class="flex rounded-md bg-white outline-1 -outline-offset-1 outline-gray-300 has-[input:focus-within]:outline-2 has-[input:focus-within]:-outline-offset-2 has-[input:focus-within]:outline-indigo-600">
                                    <div class="grid shrink-0 grid-cols-1 focus-within:relative">
                                        <select id="country" name="country" autocomplete="country" aria-label="Country"
                                            class="col-start-1 row-start-1 w-full appearance-none rounded-md py-2 pr-7 pl-3.5 text-base text-gray-500 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6">
                                            <option>US</option>
                                            <option>CA</option>
                                            <option>EU</option>
                                        </select>
                                        <svg class="pointer-events-none col-start-1 row-start-1 mr-2 size-5 self-center justify-self-end text-gray-500 sm:size-4"
                                            viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" data-slot="icon">
                                            <path fill-rule="evenodd"
                                                d="M4.22 6.22a.75.75 0 0 1 1.06 0L8 8.94l2.72-2.72a.75.75 0 1 1 1.06 1.06l-3.25 3.25a.75.75 0 0 1-1.06 0L4.22 7.28a.75.75 0 0 1 0-1.06Z"
                                                clip-rule="evenodd" />
                                        </svg>
                                    </div>
                                    <input type="text" name="phone-number" id="phone-number"
                                        class="block min-w-0 grow py-1.5 pr-3 pl-1 text-base text-gray-900 placeholder:text-gray-400 focus:outline-none sm:text-sm/6"
                                        placeholder="123-456-7890">
                                </div>
                            </div>
                        </div>
                        <div class="sm:col-span-2">
                            <label for="message" class="block text-sm/6 font-semibold text-gray-900">Message</label>
                            <div class="mt-2.5">
                                <textarea name="message" id="message" rows="4"
                                    class="block w-full rounded-md bg-white px-3.5 py-2 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600"></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="mt-10 text-center">
                        <button
                            class="border border-black rounded-md w-1/2 h-[50px]  bg-cyan-300 text-black  duration-1000 ease-in-out hover:text-white hover:border-cyan-600 hover:bg-gradient-to-r from-sky-950 via-sky-500 to-sky-300 m-auto"><a
                                href="#sect-contact">Send
                            </a></button>
                    </div>
                </form>
            </div>

            </div>

        </section>
    </main>
    <footer  class="bg-cyan-200 h-[100px] text-center mt-10">
        <p class="p-10">Created by me 2025 ❤️</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="../assets/js/script.js"></script>
</body>

</html>
